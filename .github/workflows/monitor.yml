name: Tender monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron běží v UTC. Praha je UTC+1 v zimě a UTC+2 v létě,
    # proto se workflow probudí v obou možných UTC časech a níže se spustí
    # pouze tehdy, když je v Europe/Prague právě 08:00.
    - cron: "0 6,7 * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      TENDER_DB_PATH: data/tenders.sqlite3
      TENDER_REPORT_DIR: reports
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS || 'true' }}
    steps:
      - name: Check Prague schedule gate
        id: prague_schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run requested. Continuing."
          elif [ "$(TZ=Europe/Prague date +%H)" = "08" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "It is 08:00 in Europe/Prague. Continuing."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Not 08:00 in Europe/Prague. Skipping duplicate UTC schedule."
          fi

      - name: Checkout
        if: steps.prague_schedule.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.prague_schedule.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.prague_schedule.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run monitor and e-mail report
        if: steps.prague_schedule.outputs.should_run == 'true'
        run: python -m tender_monitor run

      - name: Upload reports
        if: always() && steps.prague_schedule.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tender-reports
          path: |
            reports/*.xlsx
            reports/*.html
            data/*.sqlite3
          if-no-files-found: warn
