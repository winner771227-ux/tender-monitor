name: Tender monitor

on:
  workflow_dispatch:
  schedule:
    # Jeden spolehlivý cron čas. Necelá minuta (17) snižuje šanci
    # zahození GitHubem během period nejvyšší zátěže.
    - cron: "17 6 * * *"

concurrency:
  # Pojistka: pokud by se sešly dva běhy najednou (manuální + scheduled),
  # GitHub automaticky zruší ten starší a pustí jen jeden.
  group: tender-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      TENDER_DB_PATH: data/tenders.sqlite3
      TENDER_REPORT_DIR: reports
      SMTP_HOST:     ${{ secrets.SMTP_HOST }}
      SMTP_PORT:     ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM:     ${{ secrets.SMTP_FROM }}
      SMTP_TO:       ${{ secrets.SMTP_TO }}
      SMTP_USE_TLS:  ${{ secrets.SMTP_USE_TLS || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nastavení Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalace Python závislostí
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalace Chromium (Playwright)
        run: |
          python -m playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Spuštění monitoringu
        run: python -m tender_monitor run

      - name: Uložení reportů
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tender-reports-${{ github.run_number }}
          path: |
            reports/*.xlsx
            reports/*.html
            data/*.sqlite3
          if-no-files-found: warn
