name: Tender monitor

on:
  workflow_dispatch:
  schedule:
    # Cron v "rovnou hodinu" (0 6 * * *) spadá do období nejvyšší zátěže
    # GitHub Actions a může být zahozen. Použijeme necelou minutu (6:13)
    # a navíc 2 zálohy o 15 a 30 minut později pro jistotu.
    - cron: "13 6 * * *"
    - cron: "28 6 * * *"
    - cron: "43 6 * * *"

jobs:
  monitor:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # Pojistka: pokud se workflow spustí 2x kvůli 3 cronům, druhý běh
    # se zastaví hned na začátku (viz krok "Kontrola duplicity" níže)
    env:
      PYTHONPATH: src
      TENDER_DB_PATH: data/tenders.sqlite3
      TENDER_REPORT_DIR: reports
      SMTP_HOST:     ${{ secrets.SMTP_HOST }}
      SMTP_PORT:     ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM:     ${{ secrets.SMTP_FROM }}
      SMTP_TO:       ${{ secrets.SMTP_TO }}
      SMTP_USE_TLS:  ${{ secrets.SMTP_USE_TLS || 'true' }}

    steps:
      - name: Kontrola duplicitního běhu
        id: dedup
        run: |
          # Pokud dnes už proběhl úspěšný běh (existuje commit s dnešním datem
          # v data/.last_run), přeskočíme – ochrana proti 3x stejnému emailu
          TODAY=$(date -u +%Y-%m-%d)
          if [ -f "data/.last_run" ] && grep -q "$TODAY" "data/.last_run" 2>/dev/null; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Dnešní běh už proběhl, přeskakuji duplicitu."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.dedup.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Nastavení Python 3.12
        if: steps.dedup.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalace Python závislostí
        if: steps.dedup.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalace Chromium (Playwright)
        if: steps.dedup.outputs.should_run == 'true'
        run: |
          python -m playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Spuštění monitoringu
        if: steps.dedup.outputs.should_run == 'true'
        run: python -m tender_monitor run

      - name: Zápis značky dnešního běhu
        if: steps.dedup.outputs.should_run == 'true'
        run: |
          mkdir -p data
          date -u +%Y-%m-%d > data/.last_run
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add data/.last_run
          git commit -m "chore: značka běhu $(date -u +%Y-%m-%d)" || echo "Nic ke commitu"
          git push || echo "Push selhal (možná souběh) – nevadí"

      - name: Uložení reportů
        if: always() && steps.dedup.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tender-reports-${{ github.run_number }}
          path: |
            reports/*.xlsx
            reports/*.html
            data/*.sqlite3
          if-no-files-found: warn
